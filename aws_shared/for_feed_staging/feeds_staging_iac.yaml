AWSTemplateFormatVersion: '2010-09-09'
Description: Shared staging feeds bucket and developer read access.

Parameters:
  DeveloperGroupName:
    Type: String
    Description: Name of an existing IAM group in this account (not an ARN or path).
    Default: developer
    AllowedPattern: '[A-Za-z0-9_+=,.@-]+'
    MinLength: 1
    MaxLength: 128
Resources:
  FeedsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'acctguv-feeds-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: TierCurrentAndPreviousVersions
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: accountableguv
        - Key: Name
          Value: feeds

  FeedsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FeedsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FeedsBucket.Arn
              - !Sub '${FeedsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  DeveloperFeedsReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${FeedsBucket}-developer-read'
      Groups:
        - !Ref DeveloperGroupName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListFeeds
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:GetBucketLocation
            Resource: !GetAtt FeedsBucket.Arn
          - Sid: ReadFeeds
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub '${FeedsBucket.Arn}/*'

Outputs:
  FeedsBucketName:
    Description: Bucket name for feed uploads.
    Value: !Ref FeedsBucket
  FeedsBucketArn:
    Description: Bucket ARN for IAM policies and integration with other resources.
    Value: !GetAtt FeedsBucket.Arn
