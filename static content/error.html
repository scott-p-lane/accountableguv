<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page unavailable | Accountable Government</title>
  <style>
    :root{--ink:#17231f;--muted:#5d6964;--paper:#f7f5ee;--green:#174f3f;--dark:#0d382c}*{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;color:var(--ink);background:var(--paper);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{display:grid;width:min(720px,calc(100% - 2rem));margin:auto;padding:4rem 0;place-items:center;text-align:center}.mark{display:grid;width:3rem;height:3rem;margin-bottom:2.5rem;place-items:center;color:#fff;background:var(--green);border-radius:50%;font:700 1.3rem Georgia,serif}.label{margin:0 0 .7rem;color:var(--green);font-size:.8rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font:500 clamp(2.6rem,8vw,5rem)/1.08 Georgia,serif;letter-spacing:-.045em}p{max-width:540px;margin:1.4rem auto 2rem;color:var(--muted);font-size:1.08rem}a{display:inline-block;padding:.85rem 1.2rem;color:#fff;background:var(--dark);border-radius:.25rem;font-weight:800;text-decoration:none}a:hover,a:focus-visible{background:var(--green)}
  </style>
</head>
<body><main><span class="mark" aria-hidden="true">A</span><p class="label">Page unavailable</p><h1>We couldn’t find that page.</h1><p>The address may be incorrect, the page may have moved, or the site may be temporarily unavailable. Return home to continue.</p><a href="home.html">Return to the homepage</a></main></body>
